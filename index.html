<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizzaria Paulista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Montserrat:wght@500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

    <header class="top-bar">
        <span class="brand-text">paulista</span>
        <div class="header-icons">
            <svg viewBox="0 0 24 24" aria-label="Instagram">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <svg viewBox="0 0 24 24" aria-label="Carrinho">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
        </div>
    </header>

    <section class="hero-banner" id="heroBanner">
        <video id="heroVideo" autoplay loop muted playsinline preload="auto" poster="banner.jpg">
            <source src="banner.mp4" type="video/mp4">
            Seu navegador não suporta vídeos HTML5.
        </video>
    </section>

    <section class="search-container">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search for meals, combos, drinks...">
            <button class="filter-btn">
                <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </button>
        </div>
    </section>

    <section class="categories">
        <div class="cat-card" data-target="doce">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L2 22h20L12 2z"/>
                <path d="M6 16c2 1 4 2 6 1s4-2 6-1" stroke-width="1.2"/>
                <path d="M4 20c2 1 4 1 5 0s3-1 4 0 3 1 5 0" stroke-width="1.2"/>
                <circle cx="10" cy="13" r="1.5" fill="#ccc"/>
                <circle cx="14" cy="13" r="1.5" fill="#ccc"/>
                <circle cx="12" cy="17" r="1.5" fill="#ccc"/>
            </svg>
            <span>DOCE</span>
        </div>

        <div class="cat-card" data-target="comum">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L2 22h20L12 2z"/>
                <path d="M4 20L20 20" stroke-width="2"/>
                <circle cx="10" cy="12" r="1" fill="white"/>
                <circle cx="14" cy="12" r="1" fill="white"/>
                <circle cx="12" cy="16" r="1" fill="white"/>
                <circle cx="9" cy="16" r="1" fill="white"/>
                <circle cx="15" cy="16" r="1" fill="white"/>
            </svg>
            <span>COMUM</span>
        </div>

        <div class="cat-card" data-target="esfirras">
            <svg viewBox="0 0 24 24">
                <path d="M12 3C7 3 3 7 3 12s4 9 9 9 9-4 9-9-4-9-9-9z"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="10" cy="10" r="1" fill="#ccc"/>
                <circle cx="14" cy="14" r="1" fill="#ccc"/>
                <circle cx="13" cy="10" r="1" fill="#ccc"/>
            </svg>
            <span>ESFIRRAS</span>
        </div>

        <div class="cat-card" data-target="fogacas">
            <svg viewBox="0 0 24 24">
                <ellipse cx="12" cy="12" rx="9" ry="6"/>
                <path d="M7 10c2 2 8 2 10 0"/>
                <path d="M8 14c2 2 6 2 8 0"/>
                <path d="M12 6l-2 2 2 2 2-2-2-2z"/>
            </svg>
            <span>FOGAÇAS</span>
        </div>

        <div class="cat-card" data-target="bebidas">
            <svg viewBox="0 0 24 24">
                <path d="M9 3h5v4l-1.5 2v10h-2V9L9 7V3z"/>
                <line x1="8" y1="22" x2="16" y2="22"/>
                <path d="M16 9h4v4a2 2 0 0 1-4 0V9z"/>
                <line x1="18" y1="13" x2="18" y2="18"/>
                <line x1="15" y1="18" x2="21" y2="18"/>
            </svg>
            <span>BEBIDAS</span>
        </div>
    </section>

    <section class="main-content">

        <!-- CARDS PRINCIPAIS (ocultos quando uma categoria é selecionada) -->
        <div class="main-cards-section" id="mainCards">
            <div class="product-card">
                <div class="product-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80" alt="Pizza Artesanal">
                    <div class="badge">3</div>
                </div>
                <div class="product-info">
                    <h3>MONTE SUA PIZZA</h3>
                    <p>até 3 sabores</p>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image-wrapper">
                    <img src="https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=500&q=80" alt="Esfirra Artesanal">
                    <div class="badge">2</div>
                </div>
                <div class="product-info">
                    <h3>MONTE SUA ESFIRRA</h3>
                    <p>até 2 sabores</p>
                </div>
            </div>
        </div>

        <!-- DIVISÓRIA FINA (oculta quando uma categoria é selecionada) -->
        <div class="divider" id="divider"></div>

        <!-- CARDÁPIO DINÂMICO -->
        <div class="menu-section" id="menuSection">
            <div id="menuItems"></div>
        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
