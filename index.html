<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site fora do ar</title>
    <style>
        /* Reset e variáveis de cores com suporte automático a tema claro e escuro */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #ef4444;
            --accent-bg: rgba(239, 68, 68, 0.1);
            --btn-bg: #0f172a;
            --btn-text: #ffffff;
            --btn-hover: #1e293b;
            --border-color: #e2e8f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f19;
                --card-bg: #111827;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --accent-color: #f87171;
                --accent-bg: rgba(248, 113, 113, 0.12);
                --btn-bg: #f8fafc;
                --btn-text: #0f172a;
                --btn-hover: #e2e8f0;
                --border-color: #1f2937;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Cartão centralizado e responsivo */
        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.75rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }

        /* Ícone de desconectado */
        .icon-wrapper {
            width: 68px;
            height: 68px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background-color: var(--accent-bg);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrapper svg {
            width: 34px;
            height: 34px;
        }

        /* Tipografia */
        h1 {
            font-size: 1.625rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.975rem;
            margin-bottom: 2rem;
        }

        /* Botão de recarregar */
        .btn-reload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-reload:hover {
            background-color: var(--btn-hover);
        }

        .btn-reload:active {
            transform: scale(0.98);
        }

        .btn-reload svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <main class="container" role="main">
        <!-- Ícone de conexão interrompida / nuvem offline -->
        <div class="icon-wrapper" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <line x1="2" y1="2" x2="22" y2="22"></line>
                <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
                <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
                <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
                <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
                <path d="M5 12.86a10 10 0 0 1 5.17-2.89"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <!-- Título principal direto -->
        <h1>Site fora do ar</h1>

        <!-- Mensagem breve de apoio -->
        <p>Estamos temporariamente indisponíveis. Por favor, tente novamente mais tarde.</p>

        <!-- Botão simples para recarregar a página -->
        <button type="button" class="btn-reload" onclick="window.location.reload()">
            <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                <path d="M16 16h5v5"></path>
            </svg>
            <span>Tentar novamente</span>
        </button>
    </main>

</body>
</html>
