<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizzaria Paulista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Montserrat:wght@500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-body: #141414;
            --bg-search: #1e1e1e;
            --red-card: #9c3a3a;
            --red-btn: #9c3a3a;
            --text-white: #ffffff;
            --text-muted: #888888;
            --border-card: #333333;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background-color: var(--bg-body);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .app-container::-webkit-scrollbar { display: none; }
        .app-container { -ms-overflow-style: none; scrollbar-width: none; }

        /* =========================================
           ANIMAÇÃO DE ENTRADA DO SITE
           ========================================= */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .hero-banner { animation: fadeInScale 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        .search-container { animation: fadeInUp 0.6s 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        .categories { animation: fadeInUp 0.6s 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        .main-content { animation: fadeInUp 0.6s 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }

        /* =========================================
           HEADER FLUTUANTE
           ========================================= */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            animation: fadeInUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        .menu-icon, .header-icons svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: var(--text-white);
            stroke-width: 2;
            cursor: pointer;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
        }

        .header-icons { display: flex; gap: 18px; align-items: center; }

        /* =========================================
           BANNER COM VÍDEO EM LOOP + FALLBACK
           ========================================= */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 4px solid #111;
            /* Fallback: caso o vídeo não carregue, esta imagem aparece */
            background-color: #2a1e14;
            background-image: url('banner.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero-banner video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        /* Esconde o vídeo se der erro (JS adiciona a classe .video-error) */
        .hero-banner.video-error video {
            opacity: 0;
            pointer-events: none;
        }

        /* Camada para escurecer levemente o vídeo e melhorar o contraste */
        .hero-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.35) 0%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.55) 100%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* =========================================
           BUSCA
           ========================================= */
        .search-container {
            padding: 15px 20px;
            position: relative;
            z-index: 5;
            background-color: var(--bg-body);
            margin-top: -10px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-search);
            border-radius: 8px;
            padding: 4px 6px 4px 15px;
            border: 1px solid #333;
        }

        .search-box svg {
            width: 18px; height: 18px;
            stroke: var(--text-muted);
            fill: none; stroke-width: 2; margin-right: 10px;
        }

        .search-box input {
            flex: 1; background: transparent; border: none;
            color: var(--text-white); font-size: 13px; outline: none; padding: 8px 0;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .filter-btn {
            background-color: var(--red-btn); border: none; border-radius: 6px;
            width: 32px; height: 32px; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
        }

        .filter-btn svg { width: 14px; height: 14px; stroke: white; margin: 0; }

        /* =========================================
           CATEGORIAS
           ========================================= */
        .categories {
            display: flex; gap: 12px;
            padding: 5px 20px 20px 20px;
            overflow-x: auto; background-color: var(--bg-body);
        }
        .categories::-webkit-scrollbar { display: none; }

        .cat-card {
            min-width: 75px; height: 85px;
            border: 1px solid var(--border-card); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: transparent;
        }

        .cat-card:hover { transform: translateY(-3px); border-color: #555; }

        .cat-card.active {
            background-color: var(--red-card); border-color: var(--red-card);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(156, 58, 58, 0.4);
        }

        .cat-card svg {
            width: 38px; height: 38px; margin-bottom: 5px;
            stroke: #ccc; fill: none; stroke-width: 1.5; transition: stroke 0.3s;
        }

        .cat-card.active svg { stroke: #fff; }

        .cat-card span {
            font-size: 10px; font-weight: 700; color: #ccc;
            letter-spacing: 0.5px; transition: color 0.3s;
        }

        .cat-card.active span { color: #fff; }

        /* =========================================
           CONTAINER PRINCIPAL
           ========================================= */
        .main-content {
            position: relative;
            padding: 0 20px 30px 20px;
            min-height: 300px;
        }

        /* =========================================
           SEÇÃO DOS CARDS PRINCIPAIS
           ========================================= */
        .main-cards-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 1;
            transform: translateX(0) scale(1);
            visibility: visible;
        }

        .main-cards-section.hidden {
            opacity: 0;
            transform: translateX(-100%) scale(0.9);
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            visibility: hidden;
        }

        .product-card {
            display: flex; flex-direction: column; cursor: pointer;
            transition: transform 0.3s;
        }

        .product-card:hover { transform: translateY(-5px); }

        .product-image-wrapper {
            width: 100%; height: 150px; border-radius: 15px;
            position: relative; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .product-image-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s;
        }

        .product-card:hover .product-image-wrapper img { transform: scale(1.08); }

        .product-image-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
        }

        .badge {
            position: absolute; bottom: 10px; right: 10px;
            background-color: rgba(0,0,0,0.6); color: white;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.3); z-index: 2;
        }

        .product-info {
            background-color: var(--red-card);
            padding: 12px 10px; border-radius: 10px;
            text-align: center; margin: -20px 8px 0 8px;
            position: relative; z-index: 3;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid #b34646;
        }

        .product-info h3 {
            font-size: 13px; font-weight: 800; text-transform: uppercase;
            margin-bottom: 2px; color: var(--text-white);
        }

        .product-info p { font-size: 11px; color: #f0f0f0; font-weight: 500; }

        /* =========================================
           SEÇÃO DO CARDÁPIO (DINÂMICA)
           ========================================= */
        .menu-section {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            visibility: hidden;
        }

        .menu-section.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            position: relative;
            left: 0;
            right: 0;
            visibility: visible;
        }

        .menu-category-title {
            font-size: 16px; font-weight: 800; color: var(--text-white);
            text-transform: uppercase; letter-spacing: 1px;
            margin-top: 5px; margin-bottom: 15px;
            padding-bottom: 8px; border-bottom: 2px solid var(--red-card);
            display: flex; align-items: center; gap: 8px;
        }

        .menu-category-title::before {
            content: ''; width: 4px; height: 20px;
            background-color: var(--red-card); border-radius: 2px;
        }

        .menu-item-row {
            display: flex; gap: 15px; background-color: #1e1e1e;
            border-radius: 12px; padding: 10px; border: 1px solid #2a2a2a;
            transition: all 0.3s; cursor: pointer; margin-bottom: 10px;
        }

        .menu-item-row:hover {
            background-color: #252525; border-color: var(--red-card);
            transform: translateX(5px);
        }

        .menu-item-row img {
            width: 80px; height: 80px; border-radius: 10px;
            object-fit: cover; flex-shrink: 0;
        }

        .menu-item-details {
            display: flex; flex-direction: column; justify-content: center; flex: 1;
        }

        .menu-item-details h4 {
            font-size: 14px; font-weight: 700; color: var(--text-white);
            margin-bottom: 4px; text-transform: uppercase;
        }

        .menu-item-details p {
            font-size: 11px; color: var(--text-muted);
            margin-bottom: 6px; line-height: 1.3;
        }

        .menu-item-details .price {
            font-size: 14px; font-weight: 800; color: #ff6b6b;
        }

        @keyframes slideInItem {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-section.active .menu-category-title { animation: slideInItem 0.3s ease both; }
        .menu-section.active .menu-item-row { animation: slideInItem 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        .menu-section.active .menu-item-row:nth-of-type(1) { animation-delay: 0.05s; }
        .menu-section.active .menu-item-row:nth-of-type(2) { animation-delay: 0.1s; }
        .menu-section.active .menu-item-row:nth-of-type(3) { animation-delay: 0.15s; }
        .menu-section.active .menu-item-row:nth-of-type(4) { animation-delay: 0.2s; }
        .menu-section.active .menu-item-row:nth-of-type(5) { animation-delay: 0.25s; }
        .menu-section.active .menu-item-row:nth-of-type(6) { animation-delay: 0.3s; }
    </style>
</head>
<body>

<div class="app-container">
    
    <header class="top-bar">
        <svg class="menu-icon" viewBox="0 0 24 24">
            <line x1="3" y1="12" x2="21" y2="12"></line>

        <div class="header-icons">

            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>

            muted 
            playsinline 
            preload="auto"
            poster="banner.jpg"

            Seu navegador não suporta vídeos HTML5.
        </video>
    </section>

    <section class="search-container">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search for meals, combos, drinks...">
            <button class="filter-btn">
                <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </button>
        </div>
    </section>

    <section class="categories">
        <div class="cat-card" data-target="doce">

                <path d="M12 2L2 22h20L12 2z"/>

        <div class="cat-card" data-target="comum">

                <circle cx="10" cy="12" r="1" fill="white"/>
                <circle cx="14" cy="12" r="1" fill="white"/>
                <circle cx="12" cy="16" r="1" fill="white"/>
                <circle cx="9" cy="16" r="1" fill="white"/>
                <circle cx="15" cy="16" r="1" fill="white"/>
            </svg>
            <span>COMUM</span>
        </div>
        
        <div class="cat-card" data-target="esfirras">
            <svg viewBox="0 0 24 24">
                <path d="M12 3C7 3 3 7 3 12s4 9 9 9 9-4 9-9-4-9-9-9z"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="10" cy="10" r="1" fill="#ccc"/>
                <circle cx="14" cy="14" r="1" fill="#ccc"/>
                <circle cx="13" cy="10" r="1" fill="#ccc"/>
            </svg>
            <span>ESFIRRAS</span>
        </div>
        
        <div class="cat-card" data-target="fogacas">

                <line x1="15" y1="18" x2="21" y2="18"/>

    <section class="main-content">
        
        <!-- CARDS PRINCIPAIS -->
        <div class="main-cards-section" id="mainCards">
            <div class="product-card">
                <div class="product-image-wrapper">

                </div>

                    <div class="badge">2</div>
                </div>
                <div class="product-info">
                    <h3>MONTE SUA ESFIRRA</h3>

        <!-- CARDÁPIO DINÂMICO -->
        <div class="menu-section" id="menuSection">
            <div class="menu-category-title" id="menuTitle">Cardápio</div>
            <div id="menuItems"></div>
        </div>
    </section>
</div>

<script>
    // ============================================
    // FALLBACK DO VÍDEO (caso banner.mp4 falhe)
    // ============================================
    (function() {
        const heroBanner = document.getElementById('heroBanner');
        const heroVideo = document.getElementById('heroVideo');

        function handleVideoError() {
            // Esconde o vídeo; a imagem de fundo (background-image no .hero-banner) assume
            heroBanner.classList.add('video-error');
        }

        // Erro no elemento <video> (ex.: arquivo inexistente)
        heroVideo.addEventListener('error', handleVideoError, true);

        // Erro no <source> (caso o MP4 não carregue)
        const sourceEl = heroVideo.querySelector('source');
        if (sourceEl) {
            sourceEl.addEventListener('error', handleVideoError);
        }

        // Se após 4s o vídeo não estiver pronto nem tocando, cai no fallback
        setTimeout(() => {
            if (heroVideo.readyState === 0 && heroVideo.networkState === 3) {
                handleVideoError();
            }
        }, 4000);
    })();

    // ============================================
    // BANCO DE DADOS DOS CARDÁPIOS
    // ============================================
    const cardapios = {

                { img: "https://images.unsplash.com/photo-1595854341625-f33ee10dbf94?w=200&q=80", nome: "Portuguesa", desc: "Presunto, ovo, cebola, azeitona e mussarela", preco: "R$ 52,90" }
            ]
        },
        esfirras: {
            titulo: "Esfirras",
            itens: [
                { img: "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=200&q=80", nome: "Esfirra de Carne", desc: "Carne moída temperada com especiarias", preco: "R$ 12,90" },
                { img: "https://images.unsplash.com/photo-1509722747041-616f39b57569?w=200&q=80", nome: "Esfirra de Queijo", desc: "Queijo mussarela derretido e orégano", preco: "R$ 11,90" },
                { img: "https://images.unsplash.com/photo-1594007654729-407eedc4be65?w=200&q=80", nome: "Esfirra de Frango", desc: "Frango desfiado com catupiry", preco: "R$ 13,90" }
            ]
        },
        fogacas: {
            titulo: "Fogaças",
            itens: [
                { img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=200&q=80", nome: "Fogaça Salgada", desc: "Massa artesanal com sal grosso e ervas", preco: "R$ 15,90" },
                { img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=200&q=80", nome: "Fogaça de Calabresa", desc: "Recheio de calabresa e queijo", preco: "R$ 18,90" },
                { img: "https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=200&q=80", nome: "Fogaça Doce", desc: "Cobertura de açúcar e canela", preco: "R$ 14,90" }
            ]
        },
        bebidas: {
            titulo: "Bebidas",
            itens: [
                { img: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=200&q=80", nome: "Refrigerante Lata", desc: "Coca-Cola, Guaraná ou Fanta 350ml", preco: "R$ 6,90" },
                { img: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=200&q=80", nome: "Suco Natural", desc: "Laranja, limão ou maracujá 500ml", preco: "R$ 12,90" },
                { img: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=200&q=80", nome: "Vinho Tinto", desc: "Taça de vinho tinto seco", preco: "R$ 25,90" }
            ]
        }
    };

    // ============================================
    // LÓGICA DE INTERAÇÃO DAS CATEGORIAS
    // ============================================
    const mainCards = document.getElementById('mainCards');
    const menuSection = document.getElementById('menuSection');
    const menuTitle = document.getElementById('menuTitle');
    const menuItems = document.getElementById('menuItems');
    const allCatCards = document.querySelectorAll('.cat-card');

    let activeCategory = null;

    function renderMenu(categoryKey) {
        const data = cardapios[categoryKey];
        if (!data) return;

        menuTitle.textContent = data.titulo;
        menuItems.innerHTML = '';

        data.itens.forEach(item => {
            const row = document.createElement('div');
            row.className = 'menu-item-row';
            row.innerHTML = `
                <img src="${item.img}" alt="${item.nome}">
                <div class="menu-item-details">
                    <h4>${item.nome}</h4>
                    <p>${item.desc}</p>
                    <span class="price">${item.preco}</span>
                </div>
            `;
            menuItems.appendChild(row);
        });
    }

    allCatCards.forEach(cat => {
        cat.addEventListener('click', () => {
            const target = cat.dataset.target;

            if (activeCategory === target) {
                cat.classList.remove('active');
                activeCategory = null;
                menuSection.classList.remove('active');
                mainCards.classList.remove('hidden');
            } else {
                allCatCards.forEach(c => c.classList.remove('active'));
                cat.classList.add('active');
                activeCategory = target;

                renderMenu(target);

                mainCards.classList.add('hidden');
                menuSection.classList.add('active');
            }
        });
    });
</script>
